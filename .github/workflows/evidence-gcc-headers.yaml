name: evidence-gcc-headers

# Not for merge. Runs examples/cpp under a hermetic GCC toolchain for the
# clang-tidy fix in fix/clang-tidy-gcc-builtin-headers: upstream CI builds
# examples/cpp with the host toolchain only.
on:
  push:
    branches: ["evidence/gcc-headers-*"]
  workflow_dispatch:

env:
  GCC_TOOLCHAIN: --extra_toolchains=@gcc_toolchain_x86_64//:cc_toolchain

jobs:
  clang-tidy-gcc:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: bazel-contrib/setup-bazel@c5acdfb288317d0b5c0bbd7a396a3dc868bb0f86 # 0.19.0
        with:
          bazelrc: |
            common --announce_rc
            common --color=yes
      - name: Add a hermetic GCC toolchain to examples/cpp
        working-directory: examples/cpp
        run: |
          cat >> MODULE.bazel <<'EOF'

          bazel_dep(name = "gcc_toolchain", version = "0.13.0")

          gcc_toolchains = use_extension("@gcc_toolchain//toolchain:module_extensions.bzl", "gcc_toolchains")
          gcc_toolchains.toolchain(
              name = "gcc_toolchain_x86_64",
              target_arch = "x86_64",
          )
          use_repo(gcc_toolchains, "gcc_toolchain_x86_64")
          EOF
      - name: clang-tidy report for //test:gcc_headers_cc
        working-directory: examples/cpp
        env:
          USE_BAZEL_VERSION: 8.x
        # Before the fix, clang-tidy fails on GCC's headers. Print what is there
        # anyway; the next step fails the run.
        run: |
          bazel build $GCC_TOOLCHAIN --aspects=//tools/lint:linters.bzl%clang_tidy \
            --output_groups=rules_lint_human //test:gcc_headers_cc || echo "bazel build exit code: $?"
          find -L bazel-bin/test/gcc_headers_cc_rules_lint -type f \
            -exec sh -c 'echo "== $1"; cat "$1"' _ {} \;
      - name: lint test //test:clang_tidy_gcc_headers
        working-directory: examples/cpp
        env:
          USE_BAZEL_VERSION: 8.x
        run: bazel test $GCC_TOOLCHAIN --test_output=errors //test:clang_tidy_gcc_headers
